# Kotlin 컴파일러는 IntelliJ 의 utility 코드를 통해 현재 JVM 버전을 파싱하는데,
# JDK 25 의 버전 문자열을 파싱하지 못해 NPE 가 난다(Kotlin 2.0 시점 기준).
# 따라서 Gradle 데몬을 JDK 21 로 고정한다. plugin target IDE 도 JDK 21 기반이라
# 정렬에 좋다.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

# JCEF / IntelliJ Platform 빌드는 메모리를 꽤 쓰는 편
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC

# 빌드 캐시 / 병렬화
org.gradle.parallel=true
org.gradle.caching=true
