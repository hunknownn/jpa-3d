<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <!-- 3D cube wireframe (entity 표상) -->
  <g stroke="#3b82f6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- back face -->
    <polygon points="14,11 26,11 28,15 16,15" stroke="#2563eb" opacity="0.55"/>
    <!-- right face -->
    <polygon points="26,11 28,15 28,28 26,24" stroke="#1d4ed8" opacity="0.65"/>
    <!-- front face -->
    <rect x="14" y="15" width="12" height="13" rx="1" fill="#1e293b" stroke="#60a5fa"/>
    <!-- table rows -->
    <line x1="15.5" y1="19" x2="24.5" y2="19" stroke="#94a3b8" stroke-width="1"/>
    <line x1="15.5" y1="22" x2="24.5" y2="22" stroke="#94a3b8" stroke-width="1"/>
    <line x1="15.5" y1="25" x2="24.5" y2="25" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <!-- relation arrows around the cube -->
  <g stroke="#10b981" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 6 21 L 13 21"/>
    <polyline points="11,19 13,21 11,23"/>
  </g>
  <g stroke="#eab308" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 27 33 L 34 33"/>
    <polyline points="32,31 34,33 32,35"/>
  </g>
</svg>
