<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- DNA 이중 나선 -->
  <defs>
    <linearGradient id="strandFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="strandBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- 두 나선이 교차하면서 base pair (rung) 가 깊이를 만든다.
       정현파:  x = cx + r * sin(2π * y / period)
       앞 strand: 위상 0,  뒤 strand: 위상 π (좌우 반전).
       rung 색은 앞쪽이면 밝게, 뒤로 갈수록 흐리게. -->

  <!-- rungs (배치: y = 5 → 35, 8 단계). 위상 cos 부호로 깊이 판별 -->
  <g stroke-width="1.6" stroke-linecap="round">
    <!-- y=6.5 cos(2π·6.5/16) ≈ cos(2.55) ≈ -0.83 (앞 strand 가 왼쪽) -->
    <line x1="10" y1="6.5" x2="30" y2="6.5" stroke="#94a3b8" opacity="0.55"/>
    <line x1="12" y1="10.5" x2="28" y2="10.5" stroke="#cbd5e1" opacity="0.8"/>
    <line x1="14.5" y1="14.5" x2="25.5" y2="14.5" stroke="#e2e8f0" opacity="0.95"/>
    <line x1="17.5" y1="18.5" x2="22.5" y2="18.5" stroke="#f1f5f9" opacity="1"/>
    <line x1="17.5" y1="22" x2="22.5" y2="22" stroke="#f1f5f9" opacity="1"/>
    <line x1="14.5" y1="25.5" x2="25.5" y2="25.5" stroke="#e2e8f0" opacity="0.95"/>
    <line x1="12" y1="29.5" x2="28" y2="29.5" stroke="#cbd5e1" opacity="0.8"/>
    <line x1="10" y1="33.5" x2="30" y2="33.5" stroke="#94a3b8" opacity="0.55"/>
  </g>

  <!-- 앞 strand (밝은 파랑) - 사인파 -->
  <path d="M 20,4
           C 30,7  30,13  20,16
           C 10,19  10,25  20,28
           C 30,31  30,37  20,40"
        stroke="url(#strandFront)" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- 뒤 strand (보라) - 위상 반전 -->
  <path d="M 20,4
           C 10,7  10,13  20,16
           C 30,19  30,25  20,28
           C 10,31  10,37  20,40"
        stroke="url(#strandBack)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- 노드(base) - 각 나선 끝과 교차점에 -->
  <g>
    <circle cx="20" cy="4" r="1.6" fill="#3b82f6"/>
    <circle cx="20" cy="16" r="1.4" fill="#8b5cf6"/>
    <circle cx="20" cy="28" r="1.4" fill="#3b82f6"/>
    <circle cx="20" cy="40" r="1.6" fill="#8b5cf6"/>
  </g>
</svg>
